<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultLite</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main class="container py-5">
  <div class="mx-auto" style="max-width: 640px;">

    <header class="text-center mb-4">
      <h1 class="mb-1">VaultLite</h1>
      <p class="text-secondary">Cifra e decifra testo con AES-256-GCM. Nessun dato salvato lato server.</p>
    </header>

    <section class="card mb-3">
      <div class="card-body">
        <label for="key" class="form-label">Chiave AES (Base64, 32 byte)</label>
        <div class="input-group">
          <input type="text" id="key" class="form-control font-monospace" placeholder="Incolla una chiave o generane una nuova">
          <button class="btn btn-secondary" id="generate-key" type="button">Genera nuova chiave</button>
        </div>
        <div class="form-check mt-2">
          <input type="checkbox" id="remember" class="form-check-input">
          <label for="remember" class="form-check-label text-secondary small">Ricorda su questo browser</label>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <label for="input" class="form-label">Testo (in chiaro o cifrato)</label>
        <textarea id="input" class="form-control font-monospace" rows="4" placeholder="Inserisci il testo da cifrare o decifrare"></textarea>

        <div class="d-flex gap-2 my-3">
          <button class="btn btn-primary flex-fill" id="encrypt" type="button">Cifra</button>
          <button class="btn btn-primary flex-fill" id="decrypt" type="button">Decifra</button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <label for="output" class="form-label mb-0">Risultato</label>
          <button class="btn btn-sm btn-secondary" id="copy" type="button">Copia risultato</button>
        </div>
        <textarea id="output" class="form-control font-monospace" rows="4" readonly placeholder="Il risultato apparirà qui"></textarea>

        <div id="status" class="mt-3 small"></div>
      </div>
    </section>

    <footer class="text-center text-secondary small mt-4">
      Nessuna chiave o testo viene mai salvato dal server.
    </footer>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
